# ============================================================================
# Aaditech Portal — Reverse Proxy Config
# This is the ONLY entry point exposed to the network. It routes to the
# portal frontend and portal backend API. Wazuh, Zabbix, GLPI, MeshCentral,
# and Grafana are intentionally NOT reachable through this proxy — they
# are internal-only and accessed exclusively by portal-backend.
# ============================================================================

server {
    listen 80;
    server_name portal.aaditech.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name portal.aaditech.local;

    ssl_certificate     /etc/nginx/certs/portal.crt;
    ssl_certificate_key /etc/nginx/certs/portal.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Frontend (React app)
    location / {
        proxy_pass http://portal-frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Backend API
    location /api/ {
        proxy_pass http://portal-backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket support (needed for MeshCentral remote session embed)
    location /api/remote/ws/ {
        proxy_pass http://portal-backend:8000/remote/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
