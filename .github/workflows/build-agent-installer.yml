name: Build Agent Installer (.exe)

# Builds Aaditech-Agent-Setup.exe (WiX Burn bundle) on Windows and publishes
# it as a build artifact so it can be pushed to the fleet via GPO/Intune.
#
# PORTABLE BY DESIGN: server addresses are NOT baked into the .exe. Every
# value (ManagerIp, ZabbixServerIp, MeshCentralUrl, WazuhEnrollKey) is
# bal:Overridable, so they are passed at INSTALL time:
#     Aaditech-Agent-Setup.exe ManagerIp=10.73.77.58 ZabbixServerIp=10.73.77.58
#         MeshCentralUrl=https://10.73.77.58:4433 WazuhEnrollKey=...
# Migrating to a new server IP needs NO rebuild and NO secret change — just run
# the same .exe with the new address in the GPO/Intune command.
#
# No repository secrets are required for the default build (Wazuh+Zabbix).
# The only build-time value that matters is the MeshCentral device group ID,
# because the mesh agent binary itself is downloaded per-portal/group at build
# time. To include it, run the workflow with include_mesh=true and set:
#   AGENT_MESH_URL   e.g. https://your-server:4433
#   AGENT_MESH_ID    the device group ID from your MeshCentral admin UI

on:
  workflow_dispatch:
    inputs:
      wazuh_version:
        description: Wazuh agent version (e.g. 4.14.5)
        required: false
        default: '4.14.5'
      zabbix_version:
        description: Zabbix agent2 version (e.g. 7.4.3)
        required: false
        default: '7.4.3'
      include_mesh:
        description: Include MeshCentral agent (requires AGENT_MESH group)
        required: false
        default: 'false'
        type: boolean
  push:
    tags:
      - 'agent-v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Install WiX v4 CLI
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 4.0.2
          if ($LASTEXITCODE -ne 0) { dotnet tool install --global wix --version 4.0.2 --force }
          wix extension add --global WixToolset.Bal.wixext/4.0.2
          if ($LASTEXITCODE -ne 0) { throw "wix extension add failed" }
          "$env:USERPROFILE\.dotnet\tools" | Out-File -Append $env:GITHUB_PATH
          $env:Path = "$env:USERPROFILE\.dotnet\tools;$env:Path"
          wix --version

      - name: Resolve versions
        id: versions
        shell: pwsh
        run: |
          $waz = "${{ inputs.wazuh_version || '4.14.5' }}"
          $zbx = "${{ inputs.zabbix_version || '7.4.3' }}"
          $zbxmm = ($zbx -split '\.')[0..1] -join '.'
          "WAZUH_VERSION=$waz"        | Out-File $env:GITHUB_ENV -Encoding utf8
          "ZABBIX_VERSION=$zbx"       | Out-File $env:GITHUB_ENV -Encoding utf8
          "ZABBIX_MAJMIN=$zbxmm"      | Out-File $env:GITHUB_ENV -Encoding utf8

      # Vendor MSIs are mirrored as GitHub release assets because
      # packages.wazuh.com returns S3 AccessDenied (403) to GitHub runner
      # egress IPs. Assets live on release tag "agent-installer-vendor-v1";
      # regenerate them when upgrading agent versions (see scripts/refresh on
      # the release, or download + gh release upload).
      - name: Download Wazuh agent MSI
        working-directory: agent-installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force wix\vendor | Out-Null
          $dst = "wix\vendor\wazuh-agent.msi"
          Invoke-WebRequest -UseBasicParsing `
            -Uri "https://github.com/j9619655391-max/Aaditech/releases/download/agent-installer-vendor-v1/wazuh-agent.msi" `
            -OutFile $dst -ErrorAction Stop
          Get-Item $dst

      - name: Download Zabbix agent2 MSI
        working-directory: agent-installer
        shell: pwsh
        run: |
          $dst = "wix\vendor\zabbix-agent.msi"
          Invoke-WebRequest -UseBasicParsing `
            -Uri "https://github.com/j9619655391-max/Aaditech/releases/download/agent-installer-vendor-v1/zabbix-agent.msi" `
            -OutFile $dst -ErrorAction Stop
          Get-Item $dst

      - name: Download MeshCentral agent (optional)
        if: inputs.include_mesh == 'true'
        working-directory: agent-installer
        shell: pwsh
        env:
          MESH_ID: ${{ secrets.AGENT_MESH_ID }}
        run: |
          $meshUrl = "${{ secrets.AGENT_MESH_URL }}/meshagents?id=4&meshid=$env:MESH_ID"
          Invoke-WebRequest -UseBasicParsing -Uri $meshUrl -OutFile wix\vendor\meshcentral-agent.exe
          Get-Item wix\vendor\meshcentral-agent.exe

      - name: Build bundle
        id: build
        working-directory: agent-installer
        shell: pwsh
        env:
          INCLUDE_MESH: ${{ inputs.include_mesh == 'true' && '1' || '0' }}
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          wix build wix\AaditechAgentBundle.wxs -ext WixToolset.Bal.wixext -d "IncludeMesh=$env:INCLUDE_MESH" -o dist\Aaditech-Agent-Setup.exe
          if ($LASTEXITCODE -ne 0) { throw "wix build failed (exit $LASTEXITCODE)" }
          Get-Item dist\Aaditech-Agent-Setup.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aaditech-Agent-Setup.exe
          path: agent-installer/dist\Aaditech-Agent-Setup.exe
          if-no-files-found: error

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: agent-installer/dist\Aaditech-Agent-Setup.exe